<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GrapesJS Dynamic Builder</title>
    <link rel="stylesheet" href="dist/css/grapes.min.css" />
    <script src="grapes.min.js"></script>
    <style>
      body,
      html {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body>
    <div id="gjs" style="height: 0px; overflow: hidden">
      <section data-db-type="section" class="db-section">
        <div class="db-container">
          <h1 class="db-heading">Welcome to the Dynamic Builder</h1>
          <p class="db-text">
            Open the block library to compose pages from governed sections, media, forms, and data-driven components.
            Use the top bar for devices, previews, audits, SEO, schema, revisions, and exports.
          </p>
        </div>
      </section>
    </div>

    <script type="text/javascript">
      var editor = grapesjs.init({
        container: '#gjs',
        height: '100%',
        fromElement: true,
        showOffsets: true,
        noticeOnUnload: false,
        // The plugin keeps its own localStorage snapshot, so the core storage manager stays off here.
        storageManager: false,
        plugins: [
          function (editorInstance) {
            grapesjs.dynamicBuilder(editorInstance, {
              shell: { brandLabel: 'Dynamic Builder' },
              // Scope the autosave key so two demos on the same origin do not overwrite each other.
              persistence: { storageKey: 'db-project:demo' },
            });
          },
        ],
      });
    </script>
  </body>
</html>
